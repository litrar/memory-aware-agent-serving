# Fixed synthetic candidate corpus. Reviewer-only rules are excluded from model input.
# Token counts use Qwen3-4B Q8_0; input validation does not establish inference or quality success.
dataset_id = "phase1-articles-v1"
schema_version = 1
status = "candidate_input_tokenized_not_inference_validated"
synthetic = true
tokenizer_model = "Qwen3-4B-Q8_0"
tokenizer_build = "b1-797de63"
tokenizer_add_special = false

# Shared Phase 1 agent settings. These settings are part of the source dataset.
[task_settings]
dataset_id = "phase1-articles-v1"
default_combination = "SS-LL"
tool_calls = 2
tool_delay_s = 1.0
llm_seed = 0
system_prompt = '''
You are reviewing a fictional pilot-program report.
Use only the supplied document and subsequent tool messages.
Distinguish recorded results from missing information and proposals.
Do not invent outcomes, measurements, or causal explanations.
When evidence is insufficient, state the limitation.
Follow the requested response format and length.
'''
tool_results = [
  '''
Review checklist loaded:
- Keep the unit of each count explicit.
- Distinguish recorded outcomes from unverified outcomes.
- Do not treat a proposal as an implemented change.
No additional outcome data are available.
''',
  '''
Report checklist loaded:
The final report must include the main activity count, the key recorded outcome or expenditure, and the main evidence limitation.
No additional outcome data are available.
''',
]

[task_settings.response_profiles.short]
target_words = [60, 90]
step_tokens = 192
final_tokens = 192
step_instructions = [
  '''
Read the document below. Prepare an initial briefing covering: 1. the recorded activity; 2. the main results and relevant costs; 3. what the evidence cannot establish.

Write one paragraph of 60–90 English words.
Include the main activity count, the key result or expenditure, and the main evidence limitation.
Prioritize these facts over dates, opening hours, and background.
''',
  '''
Review your initial briefing against the document and the checklist. Provide a revised briefing. Make the meaning of the key counts explicit and explain the main evidence limitation. If the initial briefing was accurate, retain its conclusions.

Write one paragraph of 60–90 English words.
Include the main activity count, the key result or expenditure, and the main evidence limitation.
Prioritize these facts over dates, opening hours, and background.
''',
  '''
Write the final briefing for a reader who has not seen the document. Make it self-contained and consistent with the evidence. Do not discuss the review process.

Write one paragraph of 60–90 English words.
Include the main activity count, the key result or expenditure, and the main evidence limitation.
Prioritize these facts over dates, opening hours, and background.
''',
]

[task_settings.response_profiles.long]
target_words = [300, 400]
step_tokens = 768
final_tokens = 768
step_instructions = [
  '''
Read the document below. Prepare an initial briefing covering: 1. the recorded activity; 2. the main results and relevant costs; 3. what the evidence cannot establish.

Write 300–400 English words in four sections:
Activity, Results and resources, Evidence limitations, and Next steps.
Include the main activity count, the key result or expenditure, and the main evidence limitation.
Explain what the recorded measures mean and what they cannot show.
For next steps, you may suggest improvements, but label them as recommendations rather than facts about the pilot.
If the document lacks detail, explain the missing evidence rather than inventing it. Avoid repeating sentences merely to add length.
''',
  '''
Review your initial briefing against the document and the checklist. Provide a revised briefing. Make the meaning of the key counts explicit and explain the main evidence limitation. If the initial briefing was accurate, retain its conclusions.

Write 300–400 English words in four sections:
Activity, Results and resources, Evidence limitations, and Next steps.
Include the main activity count, the key result or expenditure, and the main evidence limitation.
Explain what the recorded measures mean and what they cannot show.
For next steps, you may suggest improvements, but label them as recommendations rather than facts about the pilot.
If the document lacks detail, explain the missing evidence rather than inventing it. Avoid repeating sentences merely to add length.
''',
  '''
Write the final briefing for a reader who has not seen the document. Make it self-contained and consistent with the evidence. Do not discuss the review process.

Write 300–400 English words in four sections:
Activity, Results and resources, Evidence limitations, and Next steps.
Include the main activity count, the key result or expenditure, and the main evidence limitation.
Explain what the recorded measures mean and what they cannot show.
For next steps, you may suggest improvements, but label them as recommendations rather than facts about the pilot.
If the document lacks detail, explain the missing evidence rather than inventing it. Avoid repeating sentences merely to add length.
''',
]

[task_settings.validation_rules]
fact_recall = "Supported required facts / 4. Judge meaning and numeric units, not exact words."
contradictions = "Count claims conflicting with source, including forbidden_claims paraphrases."
unsupported_claims = "Count factual assertions not supported by source; labeled recommendations are allowed."
factual_pass = "All required facts supported, zero contradictions and zero unsupported factual claims."
strict_pass = "Factual pass AND word-length compliance AND finish_reason=stop; execution failures never pass."
review_steps = "Review each returned LLM step separately; report final and all-step pass rates."

# S/L in the first position means document context; the second means response.
# Every task keeps three LLM steps, two tools and the same tool delay.
# Patterns repeat to fill -n (default 6); mixed presets require even n for equal counts.
# Grouped patterns collect each class in the specified order.
# --long-tier chooses ONE long pool per run: near (~2000) or overload (~2600).
# Source sampling uses --seed without replacement; a run never repeats an article.

# Uniform short input/output: low-pressure control for runner overhead and queueing.
[task_settings.combinations.SS]
pattern = ["SS"]

# Compare with SS using the same seed/articles: vary response instructions/caps only.
# Tests generation time and history growth; actual output length remains measured.
[task_settings.combinations.SL]
pattern = ["SL"]

# Compare with SS: fix short-response settings, vary input-length category.
# Different source topics remain a confound; this is not a pure length causal test.
[task_settings.combinations.LS]
pattern = ["LS"]

# Compare with LS using the same seed/articles: vary response instructions/caps only.
# Long input plus growing history probes admission pressure; failures are not guaranteed.
[task_settings.combinations.LL]
pattern = ["LL"]

# SS,SL,SS,SL,SS,SL: short input throughout, mixed response budgets.
# Tests coexistence of shorter/longer generation while avoiding large input documents.
[task_settings.combinations.SS-SL]
pattern = ["SS", "SL"]

# SS,LS,SS,LS,SS,LS: short-response settings throughout, mixed input-length categories.
# Tests heterogeneous prefill/context demand; topics differ between input categories.
[task_settings.combinations.SS-LS]
pattern = ["SS", "LS"]

# SS,LL,SS,LL,SS,LL: default light/heavy mixture for admission/scheduling comparisons.
# Both input and output budgets differ; use as a mixed workload, not a one-factor test.
[task_settings.combinations.SS-LL]
pattern = ["SS", "LL"]

# LL,LL,LL,SS,SS,SS: heavy work enters FIFO first; inspect short-task queue/completion times.
# Pair with SS-first and SS-LL at the same seed/n/long-tier: identical tasks, only order differs.
# Head-of-line delay and simultaneous KV pressure are hypotheses to measure, not guaranteed outcomes.
[task_settings.combinations.LL-first]
pattern = ["LL", "SS"]
grouped = true

# SS,SS,SS,LL,LL,LL: paired arrival-order control for LL-first using identical tasks.
# Tests whether serving light tasks earlier changes completion times and completed work.
[task_settings.combinations.SS-first]
pattern = ["SS", "LL"]
grouped = true

