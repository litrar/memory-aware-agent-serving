[[articles]]
article_id = "N01"
tier = "near"
title = "Northport Ferry: Passenger Information Kiosks"
doc_target_tokens = 2000
doc = '''
Northport Ferry: Passenger Information Kiosks

Northport Ferry recorded 480 kiosk sessions during a six-week passenger-information trial.

The operations file highlights the following detail: screen placement beside the entrance. This detail belongs to the way route-information kiosks was administered, rather than to the headline outcome count. The team kept the distinction because a reader might otherwise treat an administrative arrangement as evidence of effectiveness. The review describes what the arrangement allowed staff to record, while leaving its effect on participants open. Changing the arrangement later would need a dated amendment to the operating instructions.

A separate implementation note concerns printed timetables retained during outages. The coordinator asked reviewers to preserve this detail when describing the scope of route-information kiosks. It explains a practical boundary of the service, but does not supply a new outcome measurement. A procedure can be followed consistently without establishing that the service achieved its wider purpose. The final account therefore treats this note as operational context and keeps it separate from the recorded totals.

The recordkeeping section specifies touch targets tested with gloved hands. Staff handling route-information kiosks used this distinction to decide which information belonged in which record. Combining entries without their original meaning could create a misleading aggregate even when the arithmetic was correct. The review does not replace uncertain entries with a convenient interpretation. It preserves the information needed to explain the totals and identifies questions that would require returning to the underlying records.

The access notes describe language selection before route search. Access arrangements mattered to the delivery of route-information kiosks, but the review did not turn them into a measure of universal availability. A person unable to use a particular arrangement might be absent from the administrative data altogether. The report cannot reconstruct such missing experiences. It can identify the arrangement that was in place and recommend checking who might be excluded before extending the service.

The working instructions also mention queue observations limited to staffed periods. For the review of route-information kiosks, the important distinction is between a rule written in advance and evidence that every relevant action complied with that rule. The note establishes the intended procedure. It is not a complete compliance audit. Where a record does not document an action, the reviewer should describe the documentation gap rather than assume either perfect compliance or a confirmed failure.

The practical limitations include sunlight reflections at the waterside door. This issue could affect how staff encountered or recorded activity in route-information kiosks. The file does not quantify its contribution to the final results, so the report cannot assign a numerical adjustment. The limitation is still relevant: it marks a reason that apparently similar records may not describe identical conditions. Any future comparison should decide in advance how to document those conditions.

