The Meadow Library ran an evening lending desk for six weeks and recorded 246 loans.

The loan count included renewals and repeat borrowers; it was not a count of unique readers.

The desk operated on Tuesdays and Thursdays. A borrower could make several transactions during one visit. The manager recommended reviewing the opening schedule, but no permanent extension was approved. The lending desk issued the same books and applied the same borrowing rules as the daytime service. An overdue loan remained a separate account matter. Staff did not link the trial register to school results or to a survey of people who never visited the library. The register preserved transaction dates and book identifiers. It did not measure reading time at home or distinguish a new reader from an existing member making another loan.

