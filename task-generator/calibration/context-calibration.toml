doc = '''
Harborview Cooling Center: Pilot Results

Harborview operated a cooling center at the Community Hall for six weeks. It opened on 30 weekdays, from 1 p.m. to 7 p.m.

Staff recorded 312 visits. A person could visit more than once, and the attendance system did not identify unique visitors.

The recorded pilot expenditure was $4,800. This covered temporary staff, cooling equipment and electricity, supplies, and outreach. The city provided the hall without charging the pilot.

An optional exit survey received 68 responses. Of these, 54 said they would return during a future heat event, 9 were unsure, and 5 would not return. These responses describe survey participants; they do not establish the opinions of all visitors.

The pilot did not collect health-outcome data or include a comparison neighborhood. Therefore, the available evidence cannot establish whether the center reduced heat-related illness.

The office has proposed another pilot, but it has not been approved.

Operational Background and Supporting Notes

The Community Hall was selected because it already had an accessible entrance, public restrooms, tables, chairs, and a room that could be separated from other activities. Selecting an existing building allowed the office to begin the pilot without construction work. The office did not compare the hall with alternative locations. Convenient access was a reason for choosing the site, but travel times were not measured.

The center was intended to provide a place to rest during hot afternoons. Staff offered drinking water and printed heat-safety information. They did not provide medical treatment, individual medical assessments, transportation, or overnight accommodation. Visitors who needed services outside this scope were directed to existing city information channels. The pilot did not record what happened after such referrals.

Opening procedures began before public access. Staff checked the entrance, arranged chairs, inspected water supplies, and confirmed that the room was ready. Closing procedures included collecting unused materials, checking the room, and completing the daily log. The published opening hours described access for visitors; they were not a measurement of total staff working time.

Two temporary staff members were scheduled on each open day. Their duties included welcoming visitors, recording visits, answering basic questions, and keeping supplies available. Permanent public-health employees planned and supervised the pilot. Their salaries were outside the recorded $4,800 expenditure. Consequently, that figure should not be described as a complete economic valuation of every resource used.

The expenditure ledger contained four categories: $2,700 for temporary staff, $1,350 for cooling equipment and electricity, $450 for water and paper supplies, and $300 for printing and outreach. These categories add to the recorded total. The ledger did not assign a monetary value to use of the city-owned hall. A future pilot at a different venue might therefore have a different cost structure even if attendance were similar.

Staff recorded 186 visits between 1 p.m. and 4 p.m. and 126 visits between 4 p.m. and 7 p.m. These counts add to 312. They indicate when visits were recorded, not how long visitors stayed. A visitor arriving before 4 p.m. could remain afterward. The records cannot be used to calculate the number of people simultaneously present or the average duration of a visit.

The daily log showed a maximum of 24 visits on one open day and a minimum of 2 on another. Dividing 312 visits by 30 open days gives 10.4 visits per open day. This average does not describe a typical person's behavior. It also does not show whether attendance changed because of temperature, publicity, transport availability, or other factors; those relationships were not analyzed.

The center distributed 207 printed information cards and served 438 cups of water. Staff did not track which visitors received cards, whether they read them, or whether they changed their behavior. Visitors could take multiple cups of water. Neither the card count nor the cup count provides an independent estimate of unique attendance.

Outreach consisted of library posters, neighborhood email notices, and information at two bus stops. The office did not purchase advertisements. Visitors were not systematically asked how they heard about the center. The records therefore cannot identify which outreach method produced the most visits or whether any part of the neighborhood was poorly reached.

The exit survey was optional and was offered when staff were available. It was not randomly assigned, and the office did not link survey responses to attendance records. The team cannot calculate a response rate among unique visitors. The 54 positive responses show that some respondents expected to return, but intended future use is different from observed future attendance.

No individual health information was collected. Staff did not measure changes in symptoms, emergency visits, or hospital admissions. There was also no comparison neighborhood. Attendance and survey results can support an operational description of the pilot, but they cannot establish a causal effect on heat-related illness.

For another pilot, the office proposed recording anonymous visit duration estimates and asking how visitors heard about the center. It also proposed reviewing whether opening later on very hot days would be practical. These are planning suggestions. The office has not approved a new schedule, committed additional funding, or established that longer hours would improve health outcomes.

Facility preparation and daily operations

The room layout was documented before opening so that a substitute worker could prepare the space without relying on the usual team. Chairs faced inward rather than toward the registration desk, giving visitors a place to rest without appearing to queue for an interview. A clear route connected the entrance, seating, drinking-water table, and restroom corridor. Furniture from unrelated hall activities remained outside this route. The layout drawing was an operational reference, not a survey of how visitors actually moved through the building.

A nearby bus stop and the library were included on the printed location map. The map identified the public entrance rather than a service door normally used for deliveries. Staff checked that the sign could be read from the sidewalk and that arrows did not direct people through a locked courtyard. They could explain the route to someone who telephoned, but they did not record callers' addresses or travel arrangements. Consequently, the map describes intended access and cannot be used to reconstruct the geographic distribution of attendance.

The opening checklist assigned tasks to positions rather than to named employees. The opening worker checked public access and water supplies while the second worker prepared the visit sheet and information table. If the assigned person was absent, the replacement could identify unfinished tasks from the checklist. Workers initialed completed items and noted exceptions in a separate column. The checklist did not collect visitor information, and a completed checklist was not counted as evidence that anyone had attended the center.

A notice near the entrance explained that the room was available for resting during the published hours. It listed the available facilities and told visitors that staff could not provide clinical advice. The same notice explained that attendance would be counted without collecting names. Staff were instructed to answer questions about the notice before directing a visitor to a chair. Reading the notice was voluntary; visitors were not required to sign an agreement or demonstrate that they understood the printed heat-safety material.

Staffing coverage included a handover whenever a worker took a break. The departing worker identified any missing supplies, unresolved facility issue, or request for information that still needed attention. Personal details were not included in the general handover note. This arrangement maintained continuity at the entrance and water table while using the scheduled staffing complement. The notes describe work that staff considered unfinished; they do not measure service quality or establish whether every visitor received the same amount of assistance.

Information cards were kept beside the water table and in a holder near the exit. Staff offered a card when an appropriate opportunity arose but did not require visitors to take one. Additional copies could be collected for family members. This explains why distribution was logged as a material count rather than a count of recipients. The office retained the approved card artwork so that later print orders could reproduce the same contact details and avoid inadvertently replacing them with an outdated telephone number.

Water supplies were checked at opening and during routine room checks. Replacement cups were stored separately from cleaning products, and the storage shelf carried a label indicating which stock belonged to the pilot. Staff noted shortages and damaged packaging so that the next shift could replenish supplies. The stock process distinguished material brought into the hall from material actually used. A delivery did not count as visitor consumption, and an opened package was not treated as proof that every cup in it had been served.

Equipment cables were routed along the edge of the room where possible. Workers checked for obvious damage before use and kept movable furniture away from electrical connections. They were expected to stop using equipment if they noticed an unusual smell, damaged plug, or other apparent fault, and then contact the building supervisor. Their role was limited to a basic operational check. The pilot did not commission a separate engineering evaluation, so these procedures do not establish equipment efficiency or certify the condition of the building's electrical installation.

Attendance records and administrative controls

The visit sheet was designed as a daily tally rather than a register of named participants. It included the date, the public opening period, and spaces for the two attendance intervals used in the report. Workers were asked to make marks when visits were recorded and reconcile the interval totals before filing the sheet. They did not add a personal identifier that could connect entries on different days. The design therefore supports reporting recorded visits while leaving repeat use by an individual unresolved.

If a worker noticed an arithmetic mistake before the sheet was filed, the original entry remained visible and the corrected total was initialed. A note identified the reason for the correction, such as a sum written in the wrong interval column. Workers were not permitted to replace an attendance total with a guess based on water consumption or the number of chairs occupied. This preserved a traceable distinction between correcting the document and substituting a different, unvalidated method of estimating attendance.

At the end of each week, the administrative coordinator checked that a sheet was present for each scheduled open day. The coordinator also reviewed whether the interval figures agreed with the daily total. This was a completeness and arithmetic check, not an independent recount of everyone who entered the hall. A correctly added sheet can still reflect missed or inconsistent recording at the entrance. The final report treats the tally as the available operational record rather than claiming that its measurement error was independently assessed.

Reporting scope

The completed cooling-center pilot provides an account of recorded visits, spending, and survey responses. The operational detail explains how the service and its records were organized. It does not identify unique attendance or establish a reduction in heat-related illness. Further activity remains a proposal requiring approval and an evaluation design appropriate to any future outcome claim.'''

