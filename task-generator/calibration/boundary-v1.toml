The room layout was documented before opening so that a substitute worker could prepare the space without relying on the usual team. Chairs faced inward rather than toward the registration desk, giving visitors a place to rest without appearing to queue for an interview. A clear route connected the entrance, seating, drinking-water table, and restroom corridor. Furniture from unrelated hall activities remained outside this route. The layout drawing was an operational reference, not a survey of how visitors actually moved through the building.

A nearby bus stop and the library were included on the printed location map. The map identified the public entrance rather than a service door normally used for deliveries. Staff checked that the sign could be read from the sidewalk and that arrows did not direct people through a locked courtyard. They could explain the route to someone who telephoned, but they did not record callers' addresses or travel arrangements. Consequently, the map describes intended access and cannot be used to reconstruct the geographic distribution of attendance.

The opening checklist assigned tasks to positions rather than to named employees. The opening worker checked public access and water supplies while the second worker prepared the visit sheet and information table. If the assigned person was absent, the replacement could identify unfinished tasks from the checklist. Workers initialed completed items and noted exceptions in a separate column. The checklist did not collect visitor information, and a completed checklist was not counted as evidence that anyone had attended the center.

A notice near the entrance explained that the room was available for resting during the published hours. It listed the available facilities and told visitors that staff could not provide clinical advice. The same notice explained that attendance would be counted without collecting names. Staff were instructed to answer questions about the notice before directing a visitor to a chair. Reading the notice was voluntary; visitors were not required to sign an agreement or demonstrate that they understood the printed heat-safety material.

Staffing coverage included a handover whenever a worker took a break. The departing worker identified any missing supplies, unresolved facility issue, or request for information that still needed attention. Personal details were not included in the general handover note. This arrangement maintained continuity at the entrance and water table while using the scheduled staffing complement. The notes describe work that staff considered unfinished; they do not measure service quality or establish whether every visitor received the same amount of assistance.

Information cards were kept beside the water table and in a holder near the exit. Staff offered a card when an appropriate opportunity arose but did not require visitors to take one. Additional copies could be collected for family members. This explains why distribution was logged as a material count rather than a count of recipients. The office retained the approved card artwork so that later print orders could reproduce the same contact details and avoid inadvertently replacing them with an outdated telephone number.

Water supplies were checked at opening and during routine room checks. Replacement cups were stored separately from cleaning products, and the storage shelf carried a label indicating which stock belonged to the pilot. Staff noted shortages and damaged packaging so that the next shift could replenish supplies. The stock process distinguished material brought into the hall from material actually used. A delivery did not count as visitor consumption, and an opened package was not treated as proof that every cup in it had been served.

Equipment cables were routed along the edge of the room where possible. Workers checked for obvious damage before use and kept movable furniture away from electrical connections. They were expected to stop using equipment if they noticed an unusual smell, damaged plug, or other apparent fault, and then contact the building supervisor. Their role was limited to a basic operational check. The pilot did not commission a separate engineering evaluation, so these procedures do not establish equipment efficiency or certify the condition of the building's electrical installation.

Attendance records and administrative controls

The visit sheet was designed as a daily tally rather than a register of named participants. It included the date, the public opening period, and spaces for the two attendance intervals used in the report. Workers were asked to make marks when visits were recorded and reconcile the interval totals before filing the sheet. They did not add a personal identifier that could connect entries on different days. The design therefore supports reporting recorded visits while leaving repeat use by an individual unresolved.

If a worker noticed an arithmetic mistake before the sheet was filed, the original entry remained visible and the corrected total was initialed. A note identified the reason for the correction, such as a sum written in the wrong interval column. Workers were not permitted to replace an attendance total with a guess based on water consumption or the number of chairs occupied. This preserved a traceable distinction between correcting the document and substituting a different, unvalidated method of estimating attendance.

Reporting scope

The completed cooling-center pilot provides an account of recorded visits, spending, and survey responses. The operational detail explains how the service and its records were organized. It does not identify unique attendance or establish a reduction in heat-related illness. Further activity remains a proposal requiring approval and an evaluation design appropriate to any future outcome claim.'''
