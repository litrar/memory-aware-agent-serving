doc = '''
Oakmere Repair Pilot: Results

Oakmere operated a free household-item repair pilot at its public library on 12 Saturdays.

The team recorded 96 item submissions from 71 distinct visitors. Some visitors submitted another item on a later Saturday.

Volunteers recorded 58 completed repairs. Of those 58 items, 41 passed a functional test at the end of the session. The other 17 had no recorded final test, so their working condition was not confirmed by the records.

Another 21 items were diagnosed but not repaired, and 17 were not fully assessed. These groups are separate from the 58 completed repairs.

Parts and consumable supplies cost $620. Residents were not charged.

The team did not follow up with visitors after the sessions. Therefore, the records cannot establish whether repaired items continued working at home.

A second pilot has been proposed but has not been approved.

The final records divided submissions into three mutually exclusive groups: 58 completed repairs, 21 diagnoses without a completed repair, and 17 items not fully assessed. These counts add to 96. The last group included cases in which the session ended or the visitor left before assessment was complete. The team did not record a detailed reason for every incomplete assessment.

Completed repair was a workflow status entered by a volunteer. A separate field recorded whether a final functional test had been completed successfully. Of the 58 items marked repaired, 41 had a recorded successful test. The remaining 17 had no recorded final test. Missing test records do not prove that those items failed, but they also do not confirm that the items were working.

The 21 diagnosed-but-not-repaired items remained outside the completed-repair count. Some required a replacement part that was unavailable, while others required work outside the pilot's scope. The records did not provide a reliable breakdown between those reasons. A report should therefore avoid assigning specific counts to the two explanations.

There were 11 volunteers across the pilot, with no more than 5 present on any Saturday. They recorded 146 total volunteer hours, including setup and cleanup. Volunteer hours were not assigned to individual submissions. The records therefore do not support calculating an observed repair time for each item or comparing the labor required by item category.

The association spent $620 on replacement parts and consumable supplies. Residents paid no fee. The library did not charge the pilot for the room, and volunteers were unpaid. The $620 figure is a spending category, not a complete valuation of labor, space, tools, and every other resource used. Existing tools included screwdrivers, pliers, multimeters, and safety glasses.

Volunteers disconnected items from power before opening them and used safety glasses when appropriate. Repairs were stopped during two sessions after signs of overheating were observed. No injuries were reported. The pilot did not include a formal electrical-safety inspection by a licensed technician. A functional test should not be presented as a professional safety certification.

An optional feedback form received 43 responses. Thirty-five respondents described the guidance as useful, six were unsure, and two did not find it useful. These responses concerned perceived usefulness of the guidance. They did not establish whether an item worked afterward, whether a replacement purchase was avoided, or how much money a visitor saved.

The association did not contact participants after they left. There were no observations of performance at home or duration of continued use. The records cannot establish long-term reliability, avoided waste, or avoided purchases. Even the 41 successful end-of-session tests only describe the observed condition at that point in time.

The proposed second pilot would allocate $1,000 to parts, provide another volunteer training session, and ask participants two weeks later whether their items still worked. It would also require a final test entry for every completed repair. These changes have not been approved, no start date has been chosen, and the proposed follow-up has not yet produced any data.

Workshop preparation and work areas

The library meeting room was prepared before public entry so that intake and repair work used different parts of the space. An arriving resident could describe an item at the entrance without walking through tables where tools were in use. Chairs for waiting residents were placed where volunteers could call someone forward without leaving an open item unattended. This arrangement was intended to support the session's workflow. The team did not observe movement systematically, so the layout cannot be used to calculate an average waiting time or measure visitor congestion.

The equipment list distinguished association-owned tools from tools brought by individual volunteers. Labels identified which storage case an item belonged in, and the closing checklist asked volunteers to return tools to the appropriate case. A missing screwdriver or meter lead could then be addressed as a tool-control issue rather than recorded as an expense for a replacement part used in a resident's item. The equipment list described resources available for the workshop; it did not assign a market value to the full collection.

The intake table displayed the accepted item categories and the principal exclusions. Staff used the notice to explain why a large appliance or an item with a damaged lithium battery could not be handled in the room. A conversation about an excluded item did not create a submission record unless the item was accepted into the pilot's documented workflow. The report's category totals therefore describe recorded submissions, and the team did not use informal questions at the door to estimate unmet demand outside the program's scope.

For an accepted item, a volunteer asked the resident to describe the problem in ordinary language before deciding which inspection steps were appropriate. A statement such as an intermittent failure was entered as the resident's description, not as a confirmed diagnosis. The record separated that initial description from the volunteer's later assessment. This distinction allowed a reviewer to see why work began without assuming that every reported symptom had been independently reproduced during the limited time available at the session.

Volunteers discussed how to allocate work according to familiarity with an item and the tools available. Someone comfortable inspecting a lamp might still need assistance with an unfamiliar switching mechanism. A second volunteer could examine the issue before work continued, and the team could stop when its skills were insufficient. That informal consultation was part of the workshop process. The project did not introduce a standardized skills examination or a rating that would support comparing the abilities of individual volunteers in the final report.

Parts were stored in labeled containers so that small components could be identified without searching several worktables. A volunteer who used an available part noted the relevant information on the item record when practical. Unused stock remained association property for later sessions. A container holding spare components did not establish that every component had been purchased during this pilot or installed in a submitted item. The expenditure summary was based on purchases in the accounting records rather than an estimated value of everything visible in the room.

Cleaning materials were stored away from open items and electrical equipment. At closing, volunteers checked the work surfaces for loose screws and other small parts that could belong to a resident's item. They asked residents to keep removable accessories with the associated submission whenever possible. These housekeeping measures supported orderly work and return of items. The team did not undertake a separate loss audit, so a description of its cleaning procedure should not be presented as a measured rate of component retention or proof that no accessory was ever misplaced.

The public session had a fixed closing time. Volunteers were encouraged to explain the remaining work before beginning a procedure that could not reasonably be completed within that period. When an assessment remained unfinished, the record was expected to reflect the actual status at closing rather than the status the volunteer hoped to achieve later. Residents left with their items. The workshop did not create a continuing repair obligation or keep unfinished items in storage for volunteers to work on between Saturdays.

